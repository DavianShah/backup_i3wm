# picom config - i3 session only (Linux Mint 22.3, AMD iGPU, amdgpu_bl1)
# Palette matches gruvbox-dark-hard (rofi theme) / forest polybar.
# Lives in ~/backup_i3wm/picom/picom.conf, symlinked from ~/.config/picom.

#################################
#           Backend             #
#################################

backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;

#################################
#           Shadows             #
#################################

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'toolbar'",
  "window_type = 'menu'",
  "window_type = 'notification'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'i3bar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "name = 'rofi'",
  "name = 'Notification'",
  "_NET_WM_STATE@[*]:a = '_NET_WM_STATE_FULLSCREEN'",
  "_GTK_FRAME_EXTENTS@:c"
];


#################################
#           Opacity             #
#################################

active-opacity = 1.0;
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Fullscreen windows stay fully opaque regardless of focus.
opacity-rule = [
  "100:_NET_WM_STATE@[*]:a = '_NET_WM_STATE_FULLSCREEN'"
];

#################################
#           Corners             #
#################################

corner-radius = 8;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'toolbar'",
  "window_type = 'menu'",
  "window_type = 'notification'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'i3bar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "name = 'rofi'",
  "_NET_WM_STATE@[*]:a = '_NET_WM_STATE_FULLSCREEN'"
];

#################################
#     Background-Blurring       #
#################################

blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;

blur-background-exclude = [
  "window_type = 'toolbar'",
  "window_type = 'menu'",
  "window_type = 'notification'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'desktop'",
  "class_g = 'Conky'",
  "name = 'Conky'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "name = 'rofi'",
  "name = 'Notification'",
  "_NET_WM_STATE@[*]:a = '_NET_WM_STATE_FULLSCREEN'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#         Window types          #
#################################

wintypes:
{
  dock = { shadow = false; clip-shadow-above = true; };
  toolbar = { shadow = false; blur-background = false; clip-shadow-above = true; };
  menu = { shadow = false; blur-background = false; };
  dropdown_menu = { shadow = false; blur-background = false; };
  popup_menu = { shadow = false; blur-background = false; };
  notification = { shadow = false; blur-background = false; };
  tooltip = { shadow = false; };
  desktop = { shadow = false; blur-background = false; };
};
